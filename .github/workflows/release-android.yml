name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Gradle wrapper integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' packages/android/app/build.gradle.kts)"
          test -n "$version_name"
          if [[ "v$version_name" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Android versionName v$version_name" >&2
            exit 1
          fi

      - name: Check the Linux native bindings are pinned
        run: node scripts/check-ci-bindings.mjs

      - name: Verify the vault core
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build the web bundle
        run: npm run build --workspace @keyweb/web

      - name: Stage the bundle into Android assets
        shell: bash
        run: |
          set -euo pipefail
          assets="packages/android/app/src/main/assets/web"
          rm -rf "$assets"
          mkdir -p "$assets"
          cp -R packages/web/dist/. "$assets/"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_file="$RUNNER_TEMP/keyweb-release.jks"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$keystore_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: packages/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="packages/android/app/build/outputs/apk/release/app-release.apk"
          release_apk="keyweb-${GITHUB_REF_NAME}.apk"
          test -f "$source_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$source_apk"
          cp "$source_apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "keyweb-${GITHUB_REF_NAME}.apk" \
            "keyweb-${GITHUB_REF_NAME}.apk.sha256" \
            --generate-notes \
            --title "Keyweb $GITHUB_REF_NAME" \
            --verify-tag
