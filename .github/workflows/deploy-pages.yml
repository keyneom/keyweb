name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "packages/vault-core/**"
      - "packages/vault-idb/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Repository variables, not secrets: a browser app ships all three to
      # every visitor. What protects the vault is that Drive only ever holds
      # ciphertext and the credentials are restricted to Keyweb's origins.
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
      VITE_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ vars.GOOGLE_CLOUD_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for project Pages
        run: npm run build --workspace @keyweb/web -- --base=./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
